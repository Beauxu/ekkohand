name: Build EkkoHand (Android)

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
    tags:
      - 'ekkohand-android-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Accept licenses & ensure SDK 34
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          if [ ! -d "$SDK/platforms/android-34" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          fi
          echo "ANDROID_HOME=$SDK"

      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > android/release.p12
            echo "SIGNED=1" >> "$GITHUB_ENV"
            echo "使用 release 签名密钥"
          else
            echo "SIGNED=0" >> "$GITHUB_ENV"
            echo "没有 ANDROID_KEYSTORE_B64，退回 debug 签名（升级安装需先卸载）"
          fi

      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          exec > >(tee -a "$RUNNER_TEMP/ci.log") 2>&1
          if [ "$SIGNED" = "1" ]; then
            gradle --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk EkkoHand-android.apk
          else
            gradle --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk EkkoHand-android.apk
          fi
          sha256sum EkkoHand-android.apk | tee SHA256.txt
          ls -lh EkkoHand-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: EkkoHand-Android
          path: |
            android/EkkoHand-android.apk
            android/SHA256.txt
          retention-days: 30

      - name: Push diagnostics
        if: always()
        run: |
          mkdir -p ci-logs
          {
            echo "run: ${GITHUB_RUN_ID}"
            echo "job status: ${{ job.status }}"
            echo "--- log tail ---"
            sed -E 's/[A-Za-z0-9+/=]{80,}/<redacted>/g' "$RUNNER_TEMP/ci.log" 2>/dev/null | tail -120
          } > "ci-logs/android-${GITHUB_RUN_ID}.log"
          git config user.email ci@local
          git config user.name ci
          git add -f ci-logs
          git commit -m "ci: android diagnostics" || true
          # 独立分支：mac 的 build.yml 也写 ci-log，共用会被互相 force push 覆盖
          git push origin HEAD:refs/heads/ci-log-android --force || true

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/EkkoHand-android.apk
            android/SHA256.txt
          generate_release_notes: true
          body: |
            Android 客户端（APK，arm64/armv7 通用；配了签名 secret 时是 release 签名，可覆盖升级）。

            安装后：
            1. 打开 EkkoHand，输入工作台生成的 6 位配对码；
            2. 点「授权屏幕截取」，在系统弹窗里选「开始」（手机重启后要重做一次）；
            3. 点「打开无障碍设置」，开启「EkkoHand 操作」。

            能力：截屏、点击、滑动、返回/主页、往输入框写文字、列出/打开应用、
            app 私有目录读写。**不支持**跑 shell（没有 root），也不碰支付/密码类界面。
