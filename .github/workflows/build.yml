name: Build Backon.app

on:
  push:
    branches: [main]
    paths:
      - 'agent.py'
      - 'mac/**'
      - '.github/workflows/build.yml'
    tags:
      - 'backon-v*'
      - 'ekkohand-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Heartbeat
        run: |
          mkdir -p ci-logs
          echo "run=$GITHUB_RUN_ID ref=$GITHUB_REF sha=$GITHUB_SHA started=$(date -u +%FT%TZ)" >> "ci-logs/heartbeat.log"
          git config user.email ci@local
          git config user.name ci
          git add -f ci-logs/heartbeat.log
          git commit -m "ci: heartbeat $GITHUB_RUN_ID" || true
          git push origin HEAD:refs/heads/ci-log-mac --force || echo "heartbeat push failed"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyobjc-framework-Cocoa pyobjc-framework-Quartz pyobjc-framework-ApplicationServices rumps pyinstaller certifi

      - name: UI API smoke test
        working-directory: mac
        run: |
          exec > >(tee -a "$RUNNER_TEMP/ci.log") 2>&1
          set -e
          python smoke_ui.py

      # 稳定签名身份：ad-hoc 的 designated requirement 是 cdhash，重构建一次
      # 就变一次，TCC（屏幕录制/辅助功能）授权因此反复失效。换成固定证书后
      # DR 变成 identifier + 证书，更新多少次都不用重新授权。
      # 未配置 secret 时自动退回 ad-hoc，不会把 CI 弄挂。
      - name: Import signing identity
        env:
          CERT_P12: ${{ secrets.BACKON_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.BACKON_CERT_PASSWORD }}
        run: |
          exec > >(tee -a "$RUNNER_TEMP/ci.log") 2>&1
          set -e
          if [ -z "$CERT_P12" ]; then
            echo "SIGN_IDENTITY=ad-hoc" >> "$GITHUB_ENV"
            echo "::warning::未配置 BACKON_CERT_P12，退回 ad-hoc 签名（TCC 会随版本失效）"
            exit 0
          fi
          echo "$CERT_P12" | tr -d ' \n\r\t' | base64 --decode > /tmp/backon.p12
          security create-keychain -p actions backon-sign.keychain
          security default-keychain -s backon-sign.keychain
          security unlock-keychain -p actions backon-sign.keychain
          echo "P12_BYTES=$(wc -c < /tmp/backon.p12 | tr -d ' ')"
          echo "P12_SHA256=$(shasum -a 256 /tmp/backon.p12 | cut -d' ' -f1)"
          CLEAN_PASS="$(printf '%s' "$CERT_PASSWORD" | tr -d ' \n\r\t')"
          echo "PASS_LEN=${#CLEAN_PASS}"
          echo "PASS_SHA8=$(printf '%s' "$CLEAN_PASS" | shasum -a 256 | cut -c1-8)"
          security import /tmp/backon.p12 -k backon-sign.keychain -P "$CLEAN_PASS" \
            -T /usr/bin/codesign -T /usr/bin/security || { echo "IMPORT_FAILED: p12 与密码不匹配"; exit 1; }
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions backon-sign.keychain > /dev/null
          # 自签名证书必须被系统信任，find-identity -v 才会认它为 valid codesigning 身份
          security find-certificate -c "Backon Code Signing" -p backon-sign.keychain > /tmp/backon-cert.pem
          sudo security add-trusted-cert -d -r trustRoot -k /Library/Keychains/System.keychain /tmp/backon-cert.pem
          security find-identity -v -p codesigning backon-sign.keychain
          if security find-identity -v -p codesigning backon-sign.keychain | grep -q "Backon Code Signing"; then
            echo "SIGN_IDENTITY=Backon Code Signing" >> "$GITHUB_ENV"
          else
            echo "SIGN_IDENTITY=ad-hoc" >> "$GITHUB_ENV"
            echo "::error::证书导入成功但没找到 Backon Code Signing 身份"
          fi
          rm -f /tmp/backon.p12

      - name: Build .app
        working-directory: mac
        run: |
          exec > >(tee -a "$RUNNER_TEMP/ci.log") 2>&1
          set -e
          pyinstaller --noconfirm --clean Backon.spec
          # 清掉扩展属性 / .DS_Store：残留会让 codesign --verify 报 detritus，
          # 而验签失败的 app，TCC 拒绝把辅助功能授权绑上去。
          xattr -cr dist/Backon.app || true
          find dist/Backon.app -name .DS_Store -delete || true
          xattr -cr dist/Backon.app || true
          if [ "$SIGN_IDENTITY" = "ad-hoc" ]; then
            codesign --force --deep --sign - --identifier cv.backpeng.backon dist/Backon.app
          else
            codesign --force --deep --keychain "$HOME/Library/Keychains/backon-sign.keychain-db" --sign "$SIGN_IDENTITY" --identifier cv.backpeng.backon dist/Backon.app
          fi
          echo "--- 签名结果 ---"
          codesign -dvv dist/Backon.app 2>&1 | grep -E 'Identifier|Authority|TeamIdentifier|CDHash' || true
          codesign --verify --deep --strict dist/Backon.app && echo "VERIFY_OK"
          ditto -c -k --sequesterRsrc --keepParent dist/Backon.app dist/Backon-macOS.zip
          # dmg 更干净：挂载后拖到「应用程序」，不会带 detritus 属性
          hdiutil create -volname Backon -srcfolder dist/Backon.app -ov -format UDZO dist/Backon.dmg
          codesign --force --keychain "$HOME/Library/Keychains/backon-sign.keychain-db" --sign "$SIGN_IDENTITY" --identifier cv.backpeng.backon dist/Backon.dmg 2>/dev/null || true
          shasum -a 256 dist/Backon-macOS.zip dist/Backon.dmg | tee dist/SHA256.txt
          ls -lh dist/Backon-macOS.zip dist/Backon.dmg
          # 自证：重新解包再验签，确保分发出去的就是能过验签的
          rm -rf /tmp/ziptest && mkdir -p /tmp/ziptest
          ditto -x -k dist/Backon-macOS.zip /tmp/ziptest
          xattr -cr /tmp/ziptest/Backon.app || true
          if codesign --verify --deep --strict /tmp/ziptest/Backon.app; then
            echo "ZIP_VERIFY_OK"
          else
            echo "::error::解包后验签失败"
            exit 1
          fi

      - name: Verify bundle（CA 证书必须在包内）
        run: |
          exec > >(tee -a "$RUNNER_TEMP/ci.log") 2>&1
          if [ ! -f mac/dist/Backon.app/Contents/Frameworks/certifi/cacert.pem ]; then
            echo "::error::打包缺 CA 证书，https 会 CERTIFICATE_VERIFY_FAILED"
            find mac/dist -name "cacert.pem" || true
            exit 1
          fi
          ls -lh mac/dist/Backon.app/Contents/Frameworks/certifi/
          if [ ! -d mac/dist/Backon.app/Contents/Frameworks/Quartz ]; then
            echo "::error::Quartz 没被打进包里，权限自检会全部显示 None"
            exit 1
          fi


      - uses: actions/upload-artifact@v4
        with:
          name: Backon-macOS
          path: |
            mac/dist/Backon-macOS.zip
            mac/dist/Backon.dmg
            mac/dist/SHA256.txt
          retention-days: 30


      - name: Push diagnostics
        if: always()
        run: |
          mkdir -p ci-logs
          {
            echo "run: ${GITHUB_RUN_ID}"
            echo "ref: ${GITHUB_REF}"
            echo "sha: ${GITHUB_SHA}"
            echo "job status: ${{ job.status }}"
            echo "SIGN_IDENTITY=${SIGN_IDENTITY:-unset}"
            echo "--- log tail ---"
            sed -E 's/[A-Za-z0-9+/=]{80,}/<redacted>/g' "$RUNNER_TEMP/ci.log" 2>/dev/null | tail -150
          } > "ci-logs/run-${GITHUB_RUN_ID}.log"
          cp "ci-logs/run-${GITHUB_RUN_ID}.log" ci-logs/last.log
          git config user.email ci@local
          git config user.name ci
          git add -f ci-logs
          git commit -m "ci: diagnostics" || true
          git push origin HEAD:refs/heads/ci-log-mac --force

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mac/dist/Backon-macOS.zip
            mac/dist/Backon.dmg
            mac/dist/SHA256.txt
          generate_release_notes: true
          body: |
            macOS 菜单栏客户端（arm64）。

            本版改用固定代码签名证书，屏幕录制/辅助功能授权只需给一次，
            之后更新不再失效。**首次安装前**请先把随包附带的
            `backon-cert.crt` 导入「钥匙串访问」并设为「始终信任」。

            安装：解压 → 把 Backon.app 拖进「应用程序」→ 双击 →
            菜单栏出现 EH → 输入工作台生成的 6 位配对码。
