name: Build Backon.app

on:
  push:
    branches: [main]
    paths:
      - 'agent.py'
      - 'mac/**'
      - '.github/workflows/build.yml'
    tags:
      - 'backon-v*'
      - 'ekkohand-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyobjc-framework-Cocoa rumps pyinstaller certifi

      - name: Build .app
        working-directory: mac
        run: |
          pyinstaller --noconfirm --clean Backon.spec
          codesign --force --deep --sign - --identifier cv.backpeng.backon dist/Backon.app
          ditto -c -k --keepParent dist/Backon.app dist/Backon-macOS.zip
          shasum -a 256 dist/Backon-macOS.zip | tee dist/SHA256.txt
          ls -lh dist/Backon-macOS.zip

      - name: Verify bundle（CA 证书必须在包内）
        run: |
          if [ ! -f mac/dist/Backon.app/Contents/Frameworks/certifi/cacert.pem ]; then
            echo "::error::打包缺 CA 证书，https 会 CERTIFICATE_VERIFY_FAILED"
            find mac/dist -name "cacert.pem" || true
            exit 1
          fi
          ls -lh mac/dist/Backon.app/Contents/Frameworks/certifi/

      - uses: actions/upload-artifact@v4
        with:
          name: Backon-macOS
          path: |
            mac/dist/Backon-macOS.zip
            mac/dist/SHA256.txt
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mac/dist/Backon-macOS.zip
            mac/dist/SHA256.txt
          generate_release_notes: true
          body: |
            macOS 菜单栏客户端（arm64，ad-hoc 签名）。

            安装：解压 → 把 Backon.app 拖进「应用程序」→ 双击 →
            菜单栏出现 EH → 输入工作台生成的 6 位配对码。
